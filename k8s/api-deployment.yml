apiVersion: apps/v1
kind: Deployment
metadata:
  name: nmna-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: numenera-api
  template:
    metadata:
      labels:
        app: numenera-api
    spec:
      containers:
        - name: api
          image: rdoneux/numenera:latest
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: "nmna-mysql"
            - name: APP_ENV
              value: "production"
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: "MYSQL_PORT"
            - name: DB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: "MYSQL_ROOT_PASSWORD"
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: "MYSQL_DATABASE"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: "MYSQL_USER"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "mysql"
                  key: "MYSQL_ROOT_PASSWORD"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: "mysql"
                  key: "MYSQL_DATABASE"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "jwt"
                  key: "JWT_SECRET"
            - name: REFRESH_TOKEN_EXP_HOURS
              valueFrom:
                secretKeyRef:
                  name: "jwt"
                  key: "REFRESH_TOKEN_EXP_HOURS"
            - name: ACCESS_TOKEN_EXP_MINUTES
              valueFrom:  
                secretKeyRef:
                  name: "jwt"
                  key: "ACCESS_TOKEN_EXP_MINUTES"
            
            
